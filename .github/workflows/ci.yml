name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # a metamodel is data that LINEA reads: it is valid when LINEA's own tests, which build products from it, pass
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
        with:
          path: linea-metamodels
      - uses: actions/checkout@v4
        with:
          repository: lbdudc/linea
          path: linea
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linea/package-lock.json
      - run: npm ci && npm run build
        working-directory: linea
      # the server tests start an in-memory MongoDB: fetch its binary once, before the test files race to download it
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Download the MongoDB binary the tests use
        run: node -e "const {MongoMemoryServer}=require('mongodb-memory-server');MongoMemoryServer.create().then((s)=>s.stop())"
        working-directory: linea
      - run: npx vitest run
        working-directory: linea/apps/server
        env:
          LINEA_METAMODELS_DIR: ${{ github.workspace }}/linea-metamodels
      - run: npm test -w @lbdudc/linea-core
        working-directory: linea
